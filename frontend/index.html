<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokédex Inteligente</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Marked.js para renderizar Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Customizações -->
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <!-- ── Header ── -->
<header class="pokedex-header">
  <div class="header-inner">
    <div class="header-left">
      <img
    src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png"
    alt="Pokébola"
    class="header-logo"
    />
      <div>
        <h1 class="header-title">Pokédex <span>Inteligente</span></h1>
        <p class="header-sub">Explore, analise e converse com a IA sobre qualquer Pokémon.</p>
      </div>
    </div>
  </div>
</header>

  <main class="page-body">

  <!-- ── Painel Esquerdo ── -->
  <div class="panel-left">
    <div class="search-wrapper">
      <div class="input-group">
        <input id="searchInput" type="text" class="form-control"
          placeholder="Buscar por nome ou ID..." autocomplete="off" />
        <button id="searchBtn" class="btn btn-danger">🔍</button>
      </div>
    </div>

    <div id="pokemonGrid" class="pokemon-grid"></div>

    <div class="pagination-bar">
      <button id="prevBtn" class="btn btn-outline-secondary btn-sm" disabled>← Anterior</button>
      <span id="pageInfo">Página 1</span>
      <button id="nextBtn" class="btn btn-outline-secondary btn-sm">Próxima →</button>
    </div>
  </div>

  <!-- ── Painel Direito ── -->
  <div class="panel-right">
    <div class="panel-right-inner">

      <div id="emptyState" class="empty-state">
        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png"
          alt="Pokébola" style="width:56px;opacity:0.4;filter:grayscale(1);" />
        <p>Selecione um Pokémon para ver seus detalhes</p>
      </div>

      <div id="pokemonDetail" class="d-none">
        <div class="d-flex gap-3 align-items-start mb-3 flex-wrap">
          <div class="d-flex gap-2">
            <img id="detailImage" class="pokemon-image" src="" alt="" />
            <img id="detailImageShiny" class="pokemon-image pokemon-image--shiny" src="" alt="" title="Shiny" />
          </div>
          <div>
            <span id="detailId" class="text-muted small"></span>
            <h2 id="detailName" class="text-capitalize fw-bold mb-1" style="font-size:1.4rem;"></h2>
            <div id="detailTypes" class="d-flex gap-2 mb-2"></div>
            <div class="d-flex gap-2 flex-wrap">
              <span id="detailHeight" class="badge bg-secondary">📏 --</span>
              <span id="detailWeight" class="badge bg-secondary">⚖️ --</span>
              <span id="detailXp" class="badge bg-secondary">⚡ XP --</span>
            </div>
          </div>
        </div>

        <h6 class="section-label">Estatísticas Base</h6>
        <div id="statsContainer" class="mb-3"></div>

        <h6 class="section-label">Habilidades</h6>
        <div id="abilitiesContainer" class="d-flex gap-2 flex-wrap mb-3"></div>

        <div class="chat-box">
          <h6 class="section-label">🤖 Pergunte ao Professor Carvalho</h6>
          <div id="chatMessages" class="chat-messages"></div>
          <div class="d-flex gap-2 flex-wrap mb-2">
            <button class="suggestion-btn btn btn-sm btn-outline-secondary" data-q="Quais são as fraquezas deste Pokémon?">⚔️ Fraquezas</button>
            <button class="suggestion-btn btn btn-sm btn-outline-secondary" data-q="Crie uma estratégia de batalha para este Pokémon.">🧠 Estratégia</button>
            <button class="suggestion-btn btn btn-sm btn-outline-secondary" data-q="Onde encontro este Pokémon nos jogos?">📍 Localização</button>
            <button class="suggestion-btn btn btn-sm btn-outline-secondary" data-q="Conte curiosidades sobre este Pokémon.">📖 Curiosidades</button>
          </div>
          <div class="input-group">
            <input id="chatInput" type="text" class="form-control"
              placeholder="Faça uma pergunta sobre este Pokémon..."
              autocomplete="off" maxlength="300" />
            <button id="chatSendBtn" class="btn btn-danger">Enviar</button>
          </div>
        </div>
      </div>

    </div>
  </div>

</main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
